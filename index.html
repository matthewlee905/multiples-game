<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>倍數小偵探｜小四數學（三節）</title>
  <style>
    :root {
      --bg: #fff8e7;
      --card: #ffffff;
      --primary: #ff6b35;
      --primary-dark: #e55a28;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --purple: #9b59b6;
      --blue: #3498db;
      --green: #2ecc71;
      --red: #e74c3c;
      --text: #2c3e50;
      --muted: #7f8c8d;
      --shadow: 0 6px 20px rgba(0,0,0,0.12);
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue",
                   "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(160deg, #fff8e7 0%, #e8f8f5 45%, #fce4ec 100%);
      color: var(--text);
      font-size: 20px;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body { padding: 16px; padding-bottom: 40px; max-width: 740px; margin: 0 auto; }
    .teacher-note {
      font-size: 13px; color: var(--muted); text-align: center;
      margin-bottom: 10px; letter-spacing: 0.02em;
    }
    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 26px 20px; margin-bottom: 14px;
    }
    h1 {
      font-size: 1.75rem; text-align: center; color: var(--primary);
      margin-bottom: 6px; line-height: 1.3;
    }
    .subtitle { text-align: center; font-size: 1rem; color: var(--muted); margin-bottom: 16px; }
    .goal-box {
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      border-radius: 14px; padding: 12px 14px; margin-bottom: 18px;
      font-size: 0.95rem; border-left: 6px solid var(--secondary);
    }
    .goal-box strong { color: var(--blue); }
    .label { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; display: block; }
    .pick-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .pick-btn {
      display: flex; align-items: flex-start; gap: 12px; width: 100%;
      padding: 14px 16px; border: 3px solid #e0e0e0; border-radius: 16px;
      background: #fafafa; font-size: 1.1rem; font-weight: 700; color: var(--text);
      cursor: pointer; text-align: left; font-family: inherit; min-height: 60px;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .pick-btn .emoji { font-size: 1.7rem; flex-shrink: 0; line-height: 1.2; }
    .pick-btn .desc { font-size: 0.82rem; font-weight: 500; color: var(--muted); display: block; margin-top: 2px; }
    .pick-btn.selected { border-color: var(--primary); background: #fff3ee; transform: scale(1.015); }
    .pick-btn[data-lesson="1"].selected { border-color: #27ae60; background: #e8f8ef; }
    .pick-btn[data-lesson="2"].selected { border-color: var(--blue); background: #eaf4fc; }
    .pick-btn[data-lesson="3"].selected { border-color: var(--purple); background: #f5eef8; }
    .pick-btn[data-level="support"].selected { border-color: #27ae60; background: #e8f8ef; }
    .pick-btn[data-level="basic"].selected { border-color: var(--blue); background: #eaf4fc; }
    .pick-btn[data-level="challenge"].selected { border-color: var(--purple); background: #f5eef8; }
    .step-label {
      display: inline-block; background: #eee; color: var(--muted);
      font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 8px;
      margin-bottom: 8px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 58px; padding: 14px 20px; border: none; border-radius: 16px;
      font-size: 1.2rem; font-weight: 800; font-family: inherit; cursor: pointer;
      color: #fff; background: var(--primary); box-shadow: 0 4px 0 var(--primary-dark);
      transition: transform 0.1s, box-shadow 0.1s; -webkit-user-select: none; user-select: none;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--primary-dark); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: var(--secondary); box-shadow: 0 4px 0 #3ba99f; }
    .btn-secondary:active { box-shadow: 0 1px 0 #3ba99f; }
    .btn-purple { background: var(--purple); box-shadow: 0 4px 0 #7d3c98; }
    .btn-purple:active { box-shadow: 0 1px 0 #7d3c98; }
    .btn-outline {
      background: #fff; color: var(--text); border: 3px solid #ddd; box-shadow: none;
    }
    .btn-outline:active { transform: translateY(2px); }
    .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .btn-row .btn { flex: 1; min-width: 130px; }
    .progress-bar-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .progress-track { flex: 1; height: 12px; background: #eee; border-radius: 10px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--secondary), var(--green));
      border-radius: 10px; transition: width 0.3s ease; width: 0%;
    }
    .progress-text { font-size: 0.9rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; margin-right: 6px;
    }
    .badge-support { background: #d5f5e3; color: #1e8449; }
    .badge-basic { background: #d6eaf8; color: #1a5276; }
    .badge-challenge { background: #e8daef; color: #6c3483; }
    .badge-lesson { background: #fff3cd; color: #856404; }
    .type-tag {
      display: inline-block; background: var(--accent); color: #6b4e00;
      font-size: 0.78rem; font-weight: 700; padding: 3px 10px; border-radius: 8px; margin-bottom: 10px;
    }
    .question-text {
      font-size: 1.28rem; font-weight: 700; line-height: 1.45; margin-bottom: 16px; color: var(--text);
    }
    .visual-box {
      background: #f0faf8; border: 2px solid #b2dfdb; border-radius: 14px;
      padding: 12px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .visual-box table { width: 100%; border-collapse: collapse; min-width: 260px; }
    .visual-box th, .visual-box td {
      border: 2px solid #80cbc4; padding: 8px 6px; text-align: center;
      font-size: 0.95rem; font-weight: 700;
    }
    .visual-box th { background: #4ecdc4; color: #fff; }
    .visual-box td { background: #fff; }
    .visual-box .hl { background: #ffe66d; }
    .visual-caption { font-size: 0.82rem; color: var(--muted); margin-top: 6px; text-align: center; }
    .story-banner {
      background: linear-gradient(90deg, #e8f5e9, #fffde7);
      border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
      font-size: 0.95rem; font-weight: 600;
    }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      width: 100%; min-height: 56px; padding: 12px 16px; border: 3px solid #e0e0e0;
      border-radius: 14px; background: #fff; font-size: 1.1rem; font-weight: 600;
      font-family: inherit; color: var(--text); cursor: pointer; text-align: left;
      transition: border-color 0.15s, background 0.15s; -webkit-user-select: none; user-select: none;
    }
    .option-btn:active { background: #f5f5f5; }
    .option-btn.selected { border-color: var(--blue); background: #eaf4fc; }
    .option-btn.correct { border-color: var(--green); background: #e8f8ef; }
    .option-btn.wrong { border-color: var(--red); background: #fdecea; }
    .option-btn:disabled { cursor: default; }
    .chip-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
    .chip {
      min-width: 62px; min-height: 54px; padding: 10px 14px; border: 3px solid #e0e0e0;
      border-radius: 14px; background: #fff; font-size: 1.15rem; font-weight: 700;
      font-family: inherit; color: var(--text); cursor: pointer; text-align: center;
    }
    .chip.selected { border-color: var(--blue); background: #eaf4fc; }
    .chip.correct { border-color: var(--green); background: #e8f8ef; }
    .chip.wrong { border-color: var(--red); background: #fdecea; }
    .chip.missed { border-color: var(--accent); background: #fffde7; }
    .chip:disabled { cursor: default; }
    .hint-box {
      background: #fff8e1; border: 2px dashed #f9a825; border-radius: 14px;
      padding: 12px 14px; margin: 12px 0; font-size: 0.92rem; color: #6b4e00; display: none;
    }
    .hint-box.show { display: block; }
    .feedback {
      margin-top: 14px; padding: 14px; border-radius: 14px; font-size: 1.05rem;
      font-weight: 600; display: none; line-height: 1.45;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: #e8f8ef; color: #1e8449; border: 2px solid #2ecc71; }
    .feedback.bad { background: #fdecea; color: #922b21; border: 2px solid #e74c3c; }
    .score-big { font-size: 3rem; font-weight: 900; text-align: center; color: var(--primary); margin: 8px 0 4px; }
    .score-label { text-align: center; font-size: 1.05rem; color: var(--muted); margin-bottom: 14px; }
    .stars { text-align: center; font-size: 2.2rem; margin-bottom: 12px; letter-spacing: 4px; }
    .summary-list {
      background: #f8f9fa; border-radius: 14px; padding: 12px 14px;
      margin-bottom: 16px; font-size: 0.92rem;
    }
    .summary-list li { margin-bottom: 6px; list-style: none; }
    .summary-list li::before { content: "• "; color: var(--secondary); font-weight: bold; }
    .footer-tip { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 16px; }
    .hidden { display: none !important; }
    @media (min-width: 600px) {
      body { padding: 24px; }
      h1 { font-size: 2.05rem; }
      .question-text { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <p class="teacher-note">教師備註：學習目標 — 讀懂倍數文字條件；由 1 倍起計；「以內」含上限；不代學生篩條件</p>

  <!-- START -->
  <div id="screen-start" class="screen active">
    <div class="card">
      <h1>🔎 倍數小偵探</h1>
      <p class="subtitle">小四數學 · 三節互動課件</p>
      <div class="goal-box">
        <strong>📚 學習目標：</strong>讀懂文字條件，找出正確嘅倍數答案。<br>
        倍數由 <strong>1 倍</strong>開始（第 1 個倍數＝該數本身）。唔好淨係背乘數表——要先睇清楚題目問咩！
      </div>

      <span class="step-label">步驟 1</span>
      <span class="label">📖 揀關卡（節）：</span>
      <div class="pick-group" id="lesson-group" role="radiogroup" aria-label="關卡">
        <button type="button" class="pick-btn selected" data-lesson="1" aria-pressed="true">
          <span class="emoji">🐸</span>
          <span>第1節　倍數序位探險<div class="desc">青蛙4腿 · 第幾個 · 相鄰差 · 有冇最大倍數</div></span>
        </button>
        <button type="button" class="pick-btn" data-lesson="2" aria-pressed="false">
          <span class="emoji">🔀</span>
          <span>第2節　同一倍數・不同問法<div class="desc">第n個／最初n個／以內有哪些／有多少個</div></span>
        </button>
        <button type="button" class="pick-btn" data-lesson="3" aria-pressed="false">
          <span class="emoji">🎯</span>
          <span>第3節　最接近與相鄰差<div class="desc">最接近 · 上下候選比距離 · 相鄰差</div></span>
        </button>
      </div>

      <span class="step-label">步驟 2</span>
      <span class="label">🎯 揀難度：</span>
      <div class="pick-group" id="level-group" role="radiogroup" aria-label="難度">
        <button type="button" class="pick-btn selected" data-level="support" aria-pressed="true">
          <span class="emoji">🌱</span>
          <span>支援<div class="desc">較小數／較多提示／基礎條件</div></span>
        </button>
        <button type="button" class="pick-btn" data-level="basic" aria-pressed="false">
          <span class="emoji">📘</span>
          <span>基本<div class="desc">課堂主流題 · 混合問法</div></span>
        </button>
        <button type="button" class="pick-btn" data-level="challenge" aria-pressed="false">
          <span class="emoji">🔥</span>
          <span>挑戰<div class="desc">差／遷移／易混淆選項</div></span>
        </button>
      </div>

      <button type="button" class="btn" id="btn-start">🚀 開始遊戲</button>
    </div>
    <p class="footer-tip">每局約 6 題 · 適合 35 分鐘一節課短片段 · 唔收集個人資料</p>
  </div>

  <!-- PLAY -->
  <div id="screen-play" class="screen">
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">1 / 6</span>
    </div>
    <div class="card">
      <span class="badge badge-lesson" id="lesson-badge">第1節</span>
      <span class="badge" id="level-badge">支援</span>
      <div><span class="type-tag" id="type-tag">第幾個</span></div>
      <div class="story-banner hidden" id="story-banner"></div>
      <p class="question-text" id="question-text"></p>
      <div class="visual-box hidden" id="visual-box"></div>
      <div id="options-area" class="options"></div>
      <div class="hint-box" id="hint-box"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-row" id="action-row">
        <button type="button" class="btn btn-outline" id="btn-hint" style="display:none;">💡 看提示</button>
        <button type="button" class="btn btn-secondary" id="btn-check" style="display:none;">✅ 確認答案</button>
      </div>
      <div class="btn-row" id="next-row" style="display:none;">
        <button type="button" class="btn" id="btn-retry">🔄 再試一次</button>
        <button type="button" class="btn btn-purple" id="btn-next">下一題 ➡️</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result" class="screen">
    <div class="card">
      <h1>🎉 完成啦！</h1>
      <div class="stars" id="stars"></div>
      <div class="score-big" id="score-big">0 / 6</div>
      <p class="score-label" id="score-label">答對題數</p>
      <ul class="summary-list" id="summary-list"></ul>
      <button type="button" class="btn" id="btn-again">🔁 同一關再玩</button>
      <div class="btn-row">
        <button type="button" class="btn btn-outline" id="btn-home">🏠 換關卡／難度</button>
      </div>
    </div>
    <p class="footer-tip">溫馨提示：倍數由 1 倍開始；相鄰兩個倍數相差＝基數本身</p>
  </div>

<script>
(function () {
  "use strict";

  /* ========== 雙欄視覺：序位｜數值 ========== */
  function dualTable(base, upto, highlightNth) {
    let heads = "", ords = "", vals = "";
    for (let i = 1; i <= upto; i++) {
      const hl = highlightNth && highlightNth.indexOf(i) >= 0 ? ' class="hl"' : "";
      heads += "<th" + hl + ">第" + i + "個</th>";
      ords += "<td" + hl + ">" + i + "</td>";
      vals += "<td" + hl + ">" + (base * i) + "</td>";
    }
    return '<table><tr><th>序位</th>' + heads + '</tr>' +
           '<tr><th>倍數</th>' + vals + '</tr></table>' +
           '<p class="visual-caption">🐸 每行相差 ' + base + '（基數本身）</p>';
  }

  /* ========== 題庫（按節 × 難度）==========
     mode: single | multi
     visual: optional HTML
     story: optional banner
  */
  const LESSONS = {
    1: {
      name: "倍數序位探險",
      emoji: "🐸",
      goal: "用序位讀倍數：第 n 個＝基數×n；相鄰差＝基數；倍數無限延長。",
      banks: {
        support: [
          {
            id: "L1S1", type: "nth", typeLabel: "第幾個",
            story: "🐸 一隻青蛙有 4 條腿。排成一列青蛙，總腿數就係 4 的倍數。",
            q: "第 1 個倍數（最小倍數）是多少？",
            mode: "single",
            choices: ["0", "1", "4", "8"],
            answer: "4",
            visual: dualTable(4, 5, [1]),
            hint: "第 1 個倍數＝4 × 1＝4（該數本身）。由 1 倍開始，唔由 0 開始。",
            tipWrong: "「第 1 個／最小倍數」＝基數本身。睇雙欄：序位 1 → 倍數 4。"
          },
          {
            id: "L1S2", type: "nth", typeLabel: "第幾個",
            story: "🐸 青蛙 4 腿",
            q: "4 的第 3 個倍數是多少？",
            mode: "single",
            choices: ["8", "12", "16", "3"],
            answer: "12",
            visual: dualTable(4, 5, [3]),
            hint: "第 3 個＝4 × 3。雙欄：序位 3 → 倍數 12。",
            tipWrong: "「第幾個」→ 基數 × 序位。第 3 個＝4×3。"
          },
          {
            id: "L1S3", type: "nth", typeLabel: "第幾個",
            story: "🐸 青蛙 4 腿",
            q: "4 的第 5 個倍數是多少？",
            mode: "single",
            choices: ["16", "20", "24", "5"],
            answer: "20",
            visual: dualTable(4, 6, [5]),
            hint: "第 5 個＝4 × 5＝20。",
            tipWrong: "對住雙欄：序位 5 下面嗰個數就係答案。"
          },
          {
            id: "L1S4", type: "diff", typeLabel: "相鄰差",
            story: "🐸 青蛙 4 腿",
            q: "4 的第 2 個倍數同第 3 個倍數相差多少？",
            mode: "single",
            choices: ["1", "2", "4", "8"],
            answer: "4",
            visual: dualTable(4, 5, [2, 3]),
            hint: "相鄰兩個倍數相差＝基數本身＝4。（12−8＝4）",
            tipWrong: "相鄰差永遠等於基數。第 2 個係 8，第 3 個係 12，差 4。"
          },
          {
            id: "L1S5", type: "infinite", typeLabel: "有沒有最大",
            q: "4 的倍數有沒有「最大」的一個？",
            mode: "single",
            choices: ["有，最大係 40", "有，最大係 100", "沒有，可以一直延長", "只有 10 個倍數"],
            answer: "沒有，可以一直延長",
            hint: "倍數＝4×1、4×2、4×3… 可以一直乘落去，所以冇最大倍數。",
            tipWrong: "倍數數列可以無限延長：第 11 個、第 12 個、第 100 個……都有。"
          },
          {
            id: "L1S6", type: "nth", typeLabel: "短遷移・6",
            story: "🦟 一隻蜻蜓有 6 條腿。",
            q: "6 的第 2 個倍數是多少？",
            mode: "single",
            choices: ["6", "12", "18", "2"],
            answer: "12",
            hint: "同青蛙道理一樣：第 2 個＝6 × 2＝12。",
            tipWrong: "換咗基數 6，方法一樣：第 n 個＝6 × n。"
          }
        ],
        basic: [
          {
            id: "L1B1", type: "nth", typeLabel: "第幾個",
            story: "🐸 青蛙 4 腿 · 序位｜數值",
            q: "第 1 個倍數（最小倍數）是多少？",
            mode: "single",
            choices: ["0", "4", "8", "1"],
            answer: "4",
            visual: dualTable(4, 4, [1]),
            hint: "第 1 個＝4×1＝4（該數本身）。",
            tipWrong: "最小／第 1 個倍數＝基數本身，唔係 0。"
          },
          {
            id: "L1B2", type: "nth", typeLabel: "第幾個",
            story: "🐸 青蛙 4 腿",
            q: "4 的第 11 個倍數是多少？",
            mode: "single",
            choices: ["40", "44", "48", "404"],
            answer: "44",
            hint: "第 11 個＝4 × 11＝44。可以延長雙欄：…第10個40，第11個44。",
            tipWrong: "延長數列：唔使成條寫晒，用「基數 × 序位」直接計。"
          },
          {
            id: "L1B3", type: "nth", typeLabel: "第幾個",
            story: "🐸 青蛙 4 腿",
            q: "4 的第 12 個倍數是多少？",
            mode: "single",

            id: "L3B6", type: "closest", typeLabel: "最接近",
            q: "哪一個 13 的倍數最接近 80？",
            mode: "single",
            choices: ["65", "78", "91", "80"],
            answer: "78",
            hint: "13×6=78（差 2）；13×7=91（差 11）。78 較近。",
            tipWrong: "上下候選 78 同 91，比距離。"
          }
        ],
        challenge: [
          {
            id: "L3C1", type: "closest", typeLabel: "最接近",
            q: "哪一個 17 的倍數最接近 50？",
            mode: "single",
            choices: ["34", "51", "17", "50"],
            answer: "51",
            hint: "34 差 16；51 差 1 → 51。",
            tipWrong: "最接近唔等於「不大於」——可以大過目標（好似 51>50）。"
          },
          {
            id: "L3C2", type: "reverse", typeLabel: "反求基數",
            q: "某數的第 4 個倍數是 76。這個數（基數）是多少？",
            mode: "single",
            choices: ["16", "19", "18", "76"],
            answer: "19",
            hint: "第 4 個＝基數×4＝76 → 基數＝76÷4＝19。",
            tipWrong: "反過來：已知倍數同序位，求基數＝倍數÷序位。"
          },
          {
            id: "L3C3", type: "diff", typeLabel: "相鄰差",
            q: "19 的第 5 個倍數同第 6 個倍數相差多少？",
            mode: "single",
            choices: ["1", "5", "19", "95"],
            answer: "19",
            hint: "相鄰差＝基數＝19。",
            tipWrong: "同第 2 節唔同：呢度練「差＝基數」同「最接近」一齊用。"
          },
          {
            id: "L3C4", type: "closest", typeLabel: "最接近",
            q: "哪一個 14 的倍數最接近 100？",
            mode: "single",
            choices: ["84", "98", "112", "100"],
            answer: "98",
            hint: "14×7=98（差 2）；14×8=112（差 12）。",
            tipWrong: "比距離，唔好見 100 就以為答案係 100（100 唔係 14 的倍數）。"
          },
          {
            id: "L3C5", type: "floorMax", typeLabel: "不大於・區分題",
            q: "【注意問法】不大於 50 的、最大的 17 的倍數是多少？（呢題唔係問「最接近」）",
            mode: "single",
            choices: ["34", "51", "17", "50"],
            answer: "34",
            hint: "「不大於 50」＝≤50。51>50 唔得，所以係 34。同「最接近 50→51」唔同！",
            tipWrong: "題幹寫「不大於」→ 唔可以選 51。呢題同「最接近」答案唔同，讀清條件！"
          },
          {
            id: "L3C6", type: "reverse", typeLabel: "反求基數",
            q: "某數的第 5 個倍數是 85。這個數是多少？",
            mode: "single",
            choices: ["15", "16", "17", "85"],
            answer: "17",
            hint: "基數＝85÷5＝17。",
            tipWrong: "倍數÷序位＝基數。"
          }
        ]
      }
    }
  };


  const LEVEL_META = {
    support: { name: "支援", badge: "badge-support", emoji: "🌱" },
    basic: { name: "基本", badge: "badge-basic", emoji: "📘" },
    challenge: { name: "挑戰", badge: "badge-challenge", emoji: "🔥" }
  };

  const QUESTIONS_PER_ROUND = 6;

  let lesson = 1;
  let level = "support";
  let queue = [];
  let qIndex = 0;
  let score = 0;
  let answered = false;
  let multiSelected = new Set();
  let resultsLog = [];

  const $ = (id) => document.getElementById(id);
  const screens = { start: $("screen-start"), play: $("screen-play"), result: $("screen-result") };

  function showScreen(name) {
    Object.keys(screens).forEach((k) => screens[k].classList.remove("active"));
    screens[name].classList.add("active");
    window.scrollTo(0, 0);
  }

  function bindPicks(groupId, attr, onChange) {
    document.querySelectorAll("#" + groupId + " .pick-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#" + groupId + " .pick-btn").forEach((b) => {
          b.classList.remove("selected");
          b.setAttribute("aria-pressed", "false");
        });
        btn.classList.add("selected");
        btn.setAttribute("aria-pressed", "true");
        onChange(btn.getAttribute(attr));
      });
    });
  }

  bindPicks("lesson-group", "data-lesson", (v) => { lesson = parseInt(v, 10); });
  bindPicks("level-group", "data-level", (v) => { level = v; });

  $("btn-start").addEventListener("click", startGame);
  $("btn-again").addEventListener("click", startGame);
  $("btn-home").addEventListener("click", () => showScreen("start"));
  $("btn-hint").addEventListener("click", showHint);
  $("btn-check").addEventListener("click", checkAnswer);
  $("btn-retry").addEventListener("click", retryQuestion);
  $("btn-next").addEventListener("click", nextQuestion);

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    const bank = LESSONS[lesson].banks[level];
    const n = Math.min(QUESTIONS_PER_ROUND, bank.length);
    // Keep pedagogical order for lesson banks (curriculum sequence), but allow mild shuffle within
    // For MVP: use bank order so dual-column intro comes first; if more than n, take first n after light shuffle of tail
    if (bank.length <= n) {
      queue = bank.slice();
    } else {
      // Keep first 2 in relative order (warm-up), shuffle rest, take enough
      const head = bank.slice(0, 2);
      const tail = shuffle(bank.slice(2));
      queue = head.concat(tail).slice(0, n);
    }
    qIndex = 0;
    score = 0;
    resultsLog = [];
    showScreen("play");
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    multiSelected = new Set();
    const q = queue[qIndex];
    const L = LESSONS[lesson];
    const lm = LEVEL_META[level];

    $("progress-fill").style.width = (qIndex / queue.length * 100) + "%";
    $("progress-text").textContent = (qIndex + 1) + " / " + queue.length;

    $("lesson-badge").textContent = L.emoji + " 第" + lesson + "節";
    const badge = $("level-badge");
    badge.textContent = lm.emoji + " " + lm.name;
    badge.className = "badge " + lm.badge;

    $("type-tag").textContent = q.typeLabel;
    $("question-text").textContent = q.q;

    const story = $("story-banner");
    if (q.story) {
      story.textContent = q.story;
      story.classList.remove("hidden");
    } else {
      story.classList.add("hidden");
    }

    const vis = $("visual-box");
    if (q.visual) {
      vis.innerHTML = q.visual;
      vis.classList.remove("hidden");
    } else {
      vis.innerHTML = "";
      vis.classList.add("hidden");
    }

    $("hint-box").classList.remove("show");
    $("hint-box").textContent = "";
    $("feedback").classList.remove("show", "ok", "bad");
    $("feedback").textContent = "";
    $("next-row").style.display = "none";

    const hintBtn = $("btn-hint");
    const checkBtn = $("btn-check");
    if (level === "support") {
      hintBtn.style.display = "";
      hintBtn.disabled = false;
    } else {
      hintBtn.style.display = "none";
    }

    const area = $("options-area");
    area.innerHTML = "";
    area.className = q.mode === "multi" ? "chip-grid" : "options";

    if (q.mode === "single") {
      checkBtn.style.display = "none";
      shuffle(q.choices).forEach((c) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "option-btn";
        btn.textContent = c;
        btn.addEventListener("click", () => selectSingle(btn, c));
        area.appendChild(btn);
      });
    } else {
      checkBtn.style.display = "";
      checkBtn.disabled = true;
      shuffle(q.pool.map(String)).forEach((n) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = n;
        chip.dataset.val = n;
        chip.addEventListener("click", () => toggleChip(chip, n));
        area.appendChild(chip);
      });
    }
  }

  function selectSingle(btn, value) {
    if (answered) return;
    answered = true;
    const q = queue[qIndex];
    const correct = value === q.answer;
    document.querySelectorAll(".option-btn").forEach((b) => {
      b.disabled = true;
      if (b.textContent === q.answer) b.classList.add("correct");
    });
    if (!correct) btn.classList.add("wrong");
    else btn.classList.add("correct");
    finishAttempt(correct, q);
  }

  function toggleChip(chip, n) {
    if (answered) return;
    if (multiSelected.has(n)) {
      multiSelected.delete(n);
      chip.classList.remove("selected");
    } else {
      multiSelected.add(n);
      chip.classList.add("selected");
    }
    $("btn-check").disabled = multiSelected.size === 0;
  }

  function checkAnswer() {
    if (answered) return;
    answered = true;
    const q = queue[qIndex];
    const correctSet = new Set(q.answer.map(String));
    let allOk = multiSelected.size === correctSet.size;
    if (allOk) correctSet.forEach((v) => { if (!multiSelected.has(v)) allOk = false; });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.disabled = true;
      const v = chip.dataset.val;
      if (correctSet.has(v) && multiSelected.has(v)) chip.classList.add("correct");
      else if (multiSelected.has(v) && !correctSet.has(v)) chip.classList.add("wrong");
      else if (correctSet.has(v) && !multiSelected.has(v)) chip.classList.add("missed");
    });
    $("btn-check").disabled = true;
    finishAttempt(allOk, q);
  }

  function finishAttempt(correct, q) {
    $("btn-hint").disabled = true;
    const fb = $("feedback");
    fb.classList.add("show");
    if (correct) {
      score++;
      fb.classList.add("ok");
      fb.textContent = "🎉 答對啦！你讀懂咗題目嘅條件。";
      resultsLog.push({ q: q.q, ok: true, type: q.typeLabel });
      $("btn-retry").style.display = "none";
    } else {
      fb.classList.add("bad");
      fb.innerHTML = "😅 未啱呢！<br><small>" + (q.tipWrong || "再睇清楚題目問咩。") + "</small>";
      $("hint-box").textContent = "💡 " + q.hint;
      $("hint-box").classList.add("show");
      resultsLog.push({ q: q.q, ok: false, type: q.typeLabel });
      $("btn-retry").style.display = "";
    }
    $("btn-next").textContent = qIndex + 1 >= queue.length ? "看成績 🏆" : "下一題 ➡️";
    $("next-row").style.display = "flex";
    $("progress-fill").style.width = ((qIndex + 1) / queue.length * 100) + "%";
  }

  function showHint() {
    const q = queue[qIndex];
    $("hint-box").textContent = "💡 " + q.hint;
    $("hint-box").classList.add("show");
  }

  function retryQuestion() {
    if (resultsLog.length && resultsLog[resultsLog.length - 1].q === queue[qIndex].q) {
      resultsLog.pop();
    }
    renderQuestion();
  }

  function nextQuestion() {
    qIndex++;
    if (qIndex >= queue.length) showResult();
    else renderQuestion();
  }

  function showResult() {
    showScreen("result");
    $("score-big").textContent = score + " / " + queue.length;
    const pct = score / queue.length;
    let stars = "⭐⭐⭐", label = "超棒！條件讀得好清楚！";
    if (pct < 0.34) { stars = "⭐"; label = "繼續加油！先讀題再答。"; }
    else if (pct < 0.67) { stars = "⭐⭐"; label = "唔錯！再分清唔同問法會更穩。"; }
    else if (pct < 1) { stars = "⭐⭐⭐"; label = "好叻！差一點就滿分！"; }
    $("stars").textContent = stars;
    $("score-label").textContent = label;

    const ul = $("summary-list");
    ul.innerHTML = "";
    const li0 = document.createElement("li");
    li0.textContent = "本局：第" + lesson + "節「" + LESSONS[lesson].name + "」· " + LEVEL_META[level].name;
    ul.appendChild(li0);
    const types = {};
    resultsLog.forEach((r) => {
      if (!types[r.type]) types[r.type] = { ok: 0, total: 0 };
      types[r.type].total++;
      if (r.ok) types[r.type].ok++;
    });
    Object.keys(types).forEach((t) => {
      const li = document.createElement("li");
      li.textContent = t + "：" + types[t].ok + "/" + types[t].total;
      ul.appendChild(li);
    });
    const tip = document.createElement("li");
    tip.textContent = LESSONS[lesson].goal;
    ul.appendChild(tip);
  }
})();
</script>
</body>
</html>
